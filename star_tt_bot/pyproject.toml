[project]
name = "star-tt-bot"
version = "0.1.0"
description = "Bridge STAR coagulator TTS into a TeamTalk channel (PM-only bot)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "teamtalk-py>=1.4.0",
    "websockets>=12.0",
]

[project.scripts]
star-tt-bot = "star_tt_bot.run:main"
